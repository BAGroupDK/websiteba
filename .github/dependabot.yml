version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Wait a week before proposing a new release (supply-chain safety margin).
    cooldown:
      default-days: 7
    groups:
      npm-dependencies:
        patterns: ["*"]
    ignore:
      # @astrojs/check only supports TypeScript ^5 || ^6. Remove this rule
      # once its peerDependencies include the next major.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
